[package]
name = "erasecord-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core of EraseCord: find and delete your own Discord messages"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["time", "sync", "macros", "rt"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["time", "sync", "macros", "rt", "rt-multi-thread"] }
wiremock = "0.6.5"
