[package]
name = "erasecord-app"
description = "Desktop app to delete your own Discord messages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise clashes on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "erasecord_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
erasecord-core = { version = "0.1.0", path = "../../crates/core" }
tokio = { version = "1.53.1", features = ["sync", "macros"] }
keyring = "4"
tauri-plugin-dialog = "2"
