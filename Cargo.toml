[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]
# The Tauri app needs WebKitGTK system libraries on Linux; keep plain
# `cargo build` / `cargo test` limited to the portable crates.
default-members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Rn11/erasecord"

# Small, fast release binaries (see https://tauri.app/concept/size/).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The key derivation is slow on purpose; unoptimised it makes tests crawl.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3
